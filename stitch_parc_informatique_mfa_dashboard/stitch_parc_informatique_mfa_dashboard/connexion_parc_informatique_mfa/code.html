<body class="bg-gradient-to-br from-primary to-primary-container min-h-screen flex items-center justify-center p-md relative overflow-hidden">
<!-- Atmospheric Background Pattern -->
<div class="absolute inset-0 pointer-events-none opacity-10" style="background-image: radial-gradient(circle at 2px 2px, white 1px, transparent 0); background-size: 32px 32px;"></div>
<!-- Main Auth Container -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-lg shadow-2xl relative z-10 overflow-hidden flex flex-col border border-outline-variant/30">
<!-- Header Section -->
<header class="p-xl pb-lg flex flex-col items-center text-center border-b border-outline-variant">
<div class="w-16 h-16 bg-surface-container rounded-full flex items-center justify-center mb-md border border-outline-variant">
<span class="material-symbols-outlined text-secondary icon-fill" style="font-size: 32px;">security</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary mb-xs">Parc Informatique MFA</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">Gestion du parc informatique et suivi des interventions</p>
</header>
<!-- Form Section -->
<form class="p-xl flex flex-col gap-lg bg-surface-bright">
<!-- Identifiant Field -->
<div class="flex flex-col gap-sm">
<label class="font-label-caps text-label-caps text-on-surface" for="identifiant">Identifiant / Matricule</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" style="font-size: 20px;">badge</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded pl-xl pr-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary focus:border-secondary transition-all" id="identifiant" name="identifiant" required="" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-sm">
<label class="font-label-caps text-label-caps text-on-surface flex justify-between items-center" for="password">
<span>Mot de passe</span>
</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" style="font-size: 20px;">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded pl-xl pr-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary focus:border-secondary transition-all" id="password" name="password" required="" type="password"/>
</div>
</div>
<!-- Action Area -->
<div class="pt-sm flex flex-col gap-md">
<button class="w-full bg-on-tertiary-container text-surface-container-lowest font-title-sm text-title-sm rounded py-md px-lg hover:bg-on-tertiary-container/90 focus:ring-4 focus:ring-on-tertiary-container/30 transition-all shadow-sm flex items-center justify-center gap-sm" type="submit">
                    Se connecter
                    <span class="material-symbols-outlined" style="font-size: 20px;">login</span>
</button>
</div>
</form>
<!-- Footer Section -->
<footer class="bg-surface-container-low p-md border-t border-outline-variant text-center">
<p class="font-body-sm text-body-sm text-outline flex items-center justify-center gap-xs">
<span class="material-symbols-outlined" style="font-size: 16px;">gavel</span>
                Ministère des Forces Armées
            </p>
</footer>
</main>
